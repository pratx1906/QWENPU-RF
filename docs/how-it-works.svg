<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="t d">
<title id="t">How QwenPU-RF answers a radio question</title>
<desc id="d">Qwen reads the question and emits a tool call; the RF program then runs as CPU trace tokens through the 11 compiled layers, each token checked against the RV32 reference machine; the printed report flows back into Qwen, which answers.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8f8f8a"/></marker><pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#f0eee8"/></pattern></defs>
<rect width="1600" height="640" fill="#fbfaf7"/><rect width="1600" height="640" fill="url(#g)"/>
<text x="60" y="64" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#1b1b1b">One question, one model: Qwen and the computer share the same weights</text>
<rect x="60" y="110" width="300" height="150" rx="12" fill="#ffffff" stroke="#dcdad3" stroke-width="2"/><text x="78" y="144" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1b1b1b">1 · Question</text><text x="78" y="174" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">&quot;What is the noise floor</text><text x="78" y="199" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b"> of capture 14 in dBFS,</text><text x="78" y="224" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b"> and its loudest</text><text x="78" y="249" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b"> 64-sample window?&quot;</text>
<rect x="430" y="110" width="330" height="150" rx="12" fill="#ffffff" stroke="#2060b0" stroke-width="2"/><text x="448" y="144" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1b1b1b">2 · Qwen3.5-4B</text><text x="448" y="174" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">32 language layers</text><text x="448" y="199" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">decides to call a tool:</text><text x="448" y="224" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">&lt;tool_call&gt;</text><text x="448" y="249" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b"> rf_levels(capture=14)</text>
<rect x="830" y="110" width="360" height="150" rx="12" fill="#f2faf9" stroke="#0d9488" stroke-width="2"/><text x="848" y="144" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b7a70">3 · RV32 CPU in the weights</text><text x="848" y="174" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">11 compiled layers in front</text><text x="848" y="199" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">fetch · decode · registers ·</text><text x="848" y="224" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">ALU · RAM in Gated DeltaNet</text><text x="848" y="249" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">state; no new heads</text>
<rect x="1260" y="110" width="290" height="150" rx="12" fill="#ffffff" stroke="#dcdad3" stroke-width="2"/><text x="1278" y="144" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1b1b1b">4 · Reference check</text><text x="1278" y="174" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">every CPU token compared</text><text x="1278" y="199" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">with the RV32 reference</text><text x="1278" y="224" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">27,144 / 27,144 equal</text><text x="1278" y="249" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">0 mismatches</text>
<line x1="360" y1="185" x2="428" y2="185" stroke="#8f8f8a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="760" y1="185" x2="828" y2="185" stroke="#8f8f8a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1190" y1="185" x2="1258" y2="185" stroke="#8f8f8a" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1010 262 C1010 312, 600 312, 600 266" fill="none" stroke="#8f8f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="805" y="340" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#3f3f3b">printed report (computed in the weights) returns as text</text>
<rect x="430" y="358" width="760" height="96" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="2"/><text x="448" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1b1b1b">5 · Answer</text><text x="448" y="422" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">The noise floor of capture 14 is -48.9 dBFS, and its</text><text x="448" y="447" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#3f3f3b">loudest 64-sample window is -10.4 dBFS.</text>
<text x="60" y="502" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b">Where the tokens of this one question go (27,206 tokens, 101 s on one laptop GPU)</text>
<rect x="60" y="520" width="34.0" height="30" rx="4" fill="#2060b0"/>
<rect x="94.0" y="520" width="1446.0" height="30" rx="4" fill="#0d9488"/>
<text x="60" y="578" font-family="Consolas, Menlo, monospace" font-size="15" fill="#2060b0">Qwen text: 625</text>
<text x="1540" y="578" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#0b7a70">CPU instructions executed inside the weights: 26,581 (98%)</text>
</svg>